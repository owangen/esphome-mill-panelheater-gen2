esphome:
  name: mill-panelheater-gen2

esp32:
  board: esp32dev

logger:

external_components:
  - source:
      type: git
      url: https://github.com/owangen/esphome-mill-panelheater-gen2
      ref: main
    components: [mill_panelheater_gen2]

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

climate:
  - platform: mill_panelheater_gen2
    id: mill_heater
    name: Mill Panel Heater Gen2
    uart_id: uart_bus
    rated_power: 900
    power:
      name: Mill Panel Heater Gen2 Estimated Power
